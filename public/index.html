<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Interpretador de Gases Arteriales</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const IconWrapper = ({ children }) => (
        <svg
          className="w-6 h-6"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          {children}
        </svg>
      );

      const ActivityIcon = () => (
        <IconWrapper>
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
        </IconWrapper>
      );

      const AlertCircleIcon = () => (
        <IconWrapper>
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </IconWrapper>
      );

      const CalculatorIcon = () => (
        <IconWrapper>
          <rect x="4" y="2" width="16" height="20" rx="2" ry="2" />
          <line x1="8" y1="6" x2="16" y2="6" />
          <line x1="8" y1="10" x2="16" y2="10" />
          <line x1="8" y1="14" x2="8" y2="14" />
          <line x1="12" y1="14" x2="12" y2="14" />
          <line x1="16" y1="14" x2="16" y2="14" />
          <line x1="8" y1="18" x2="16" y2="18" />
        </IconWrapper>
      );

      const formatNumber = (value) =>
        Number.isFinite(value) ? value.toFixed(1) : '\u2014';

      const ArterialGasInterpreter = () => {
        const [location, setLocation] = useState('mar');
        const [age, setAge] = useState('');
        const [gender, setGender] = useState('');
        const [ageGroup, setAgeGroup] = useState('');

        const [params, setParams] = useState({
          pH: '',
          PaCO2: '',
          HCO3: '',
          PaO2: '',
          sodio: '',
          potasio: '',
          cloro: '',
          glucosa: '',
          albumina: '4',
          lactato: '',
        });

        const [osmolaridad, setOsmolaridad] = useState(null);
        const [results, setResults] = useState(null);

        useEffect(() => {
          const sodio = parseFloat(params.sodio);
          const glucosa = parseFloat(params.glucosa);
          const potasio = parseFloat(params.potasio);

          if (Number.isFinite(sodio) && Number.isFinite(glucosa)) {
            const osm = 2 * sodio + glucosa / 18 + (Number.isFinite(potasio) ? potasio : 0);
            setOsmolaridad(osm);
          } else {
            setOsmolaridad(null);
          }
        }, [params.sodio, params.glucosa, params.potasio]);

        useEffect(() => {
          if (location !== 'bogota') {
            setAgeGroup('');
            return;
          }

          const ageNum = parseInt(age, 10);
          if (!Number.isFinite(ageNum)) {
            setAgeGroup('');
            return;
          }

          if (ageNum >= 18 && ageNum < 30) setAgeGroup('18-30');
          else if (ageNum >= 30 && ageNum < 40) setAgeGroup('30-39');
          else if (ageNum >= 40 && ageNum < 50) setAgeGroup('40-49');
          else if (ageNum >= 50 && ageNum < 60) setAgeGroup('50-59');
          else if (ageNum >= 60 && ageNum < 70) setAgeGroup('60-69');
          else if (ageNum >= 70) setAgeGroup('70+');
          else setAgeGroup('');
        }, [age, location]);

        const normalValues = {
          mar: {
            pH: { min: 7.35, max: 7.45 },
            PaCO2: { min: 35, max: 45 },
            HCO3: { min: 22, max: 28 },
            PaO2: { min: 80, max: 100 },
          },
          bogota: {
            '18-30': {
              hombre: { PaCO2: 33.3, HCO3: 21.9, PaO2: 68.1 },
              mujer: { PaCO2: 30.3, HCO3: 20.2, PaO2: 70.1 },
            },
            '30-39': {
              hombre: { PaCO2: 33.4, HCO3: 22.1, PaO2: 66.7 },
              mujer: { PaCO2: 31.4, HCO3: 20.6, PaO2: 66.9 },
            },
            '40-49': {
              hombre: { PaCO2: 33.2, HCO3: 21.7, PaO2: 66.4 },
              mujer: { PaCO2: 31.8, HCO3: 21.1, PaO2: 66.7 },
            },
            '50-59': {
              hombre: { PaCO2: 33.3, HCO3: 21.9, PaO2: 65.9 },
              mujer: { PaCO2: 34.3, HCO3: 22.8, PaO2: 62.4 },
            },
            '60-69': {
              hombre: { PaCO2: 34.5, HCO3: 22.3, PaO2: 64.1 },
              mujer: { PaCO2: 35.3, HCO3: 22.8, PaO2: 59.8 },
            },
            '70+': {
              hombre: { PaCO2: 33.5, HCO3: 21.6, PaO2: 62.5 },
              mujer: { PaCO2: 33.9, HCO3: 22.3, PaO2: 59.4 },
            },
          },
        };

        const handleInputChange = (field, value) => {
          setParams((prev) => ({ ...prev, [field]: value }));
        };

        const getNormalPaCO2 = () => {
          if (location === 'mar') return 40;
          if (location === 'bogota' && ageGroup && gender) {
            return normalValues.bogota[ageGroup]?.[gender]?.PaCO2 ?? 40;
          }
          return 40;
        };

        const getNormalHCO3 = () => {
          if (location === 'mar') return 24;
          if (location === 'bogota' && ageGroup && gender) {
            return normalValues.bogota[ageGroup]?.[gender]?.HCO3 ?? 24;
          }
          return 24;
        };

        const interpretarGases = () => {
          const pH = parseFloat(params.pH);
          const PaCO2 = parseFloat(params.PaCO2);
          const HCO3 = parseFloat(params.HCO3);
          const sodio = parseFloat(params.sodio);
          const cloro = parseFloat(params.cloro);
          const albumina = parseFloat(params.albumina);
          const lactato = parseFloat(params.lactato);

          if (!Number.isFinite(pH) || !Number.isFinite(PaCO2) || !Number.isFinite(HCO3)) {
            setResults({
              paso1: '⚠️ Ingresa valores válidos para pH, PaCO₂ y HCO₃⁻',
            });
            return;
          }

          const normalPaCO2 = getNormalPaCO2();
          const normalHCO3 = getNormalHCO3();

          const interpretation = {
            paso1: '',
            paso2: '',
            paso3: '',
            paso4: '',
            paso5: '',
            paso6: '',
            compensacion: null,
            anionGap: null,
            anionGapCorregido: null,
            delta: null,
          };

          if (pH < 7.35) {
            interpretation.paso1 = '🔴 ACIDEMIA (pH < 7.35)';
          } else if (pH >= 7.35 && pH < 7.4) {
            interpretation.paso1 = '🟡 ACIDOSIS (pH < 7.4 pero ≥ 7.35)';
          } else if (pH > 7.45) {
            interpretation.paso1 = '🔵 ALCALEMIA (pH > 7.45)';
          } else if (pH > 7.4 && pH <= 7.45) {
            interpretation.paso1 = '🟢 ALCALOSIS (pH > 7.4 pero ≤ 7.45)';
          } else {
            interpretation.paso1 = '✅ pH Normal (7.35-7.45)';
          }

          const pHBajo = pH < 7.4;
          const PaCO2Alta = PaCO2 > normalPaCO2;
          const PaCO2Baja = PaCO2 < normalPaCO2;
          const HCO3Bajo = HCO3 < normalHCO3;
          const HCO3Alto = HCO3 > normalHCO3;

          let trastornoPrimario = '';

          if (pHBajo && PaCO2Alta && !HCO3Bajo) {
            trastornoPrimario = 'Acidosis Respiratoria';
          } else if (pHBajo && HCO3Bajo && !PaCO2Alta) {
            trastornoPrimario = 'Acidosis Metabólica';
          } else if (!pHBajo && PaCO2Baja && !HCO3Alto) {
            trastornoPrimario = 'Alcalosis Respiratoria';
          } else if (!pHBajo && HCO3Alto && !PaCO2Baja) {
            trastornoPrimario = 'Alcalosis Metabólica';
          } else if (pHBajo && PaCO2Alta && HCO3Bajo) {
            const desvPaCO2 = Math.abs(PaCO2 - normalPaCO2);
            const desvHCO3 = Math.abs(HCO3 - normalHCO3);
            if (desvHCO3 > desvPaCO2) {
              trastornoPrimario = 'Acidosis Metabólica (con acidosis mixta - PaCO₂ también elevada)';
            } else {
              trastornoPrimario = 'Acidosis Respiratoria (con acidosis mixta - HCO₃⁻ también bajo)';
            }
          } else if (!pHBajo && PaCO2Baja && HCO3Alto) {
            const desvPaCO2 = Math.abs(PaCO2 - normalPaCO2);
            const desvHCO3 = Math.abs(HCO3 - normalHCO3);
            if (desvHCO3 > desvPaCO2) {
              trastornoPrimario = 'Alcalosis Metabólica (con alcalosis mixta)';
            } else {
              trastornoPrimario = 'Alcalosis Respiratoria (con alcalosis mixta)';
            }
          } else {
            trastornoPrimario = 'Compensado o Normal';
          }

          interpretation.paso2 = `Trastorno Primario: ${trastornoPrimario}`;

          let compensacionEsperada = '';
          if (trastornoPrimario.includes('Acidosis Metabólica')) {
            const valorEsperado = 1.5 * HCO3 + 8;
            const rangoMin = valorEsperado - 2;
            const rangoMax = valorEsperado + 2;
            compensacionEsperada = `PaCO₂ esperada: ${valorEsperado.toFixed(1)} mmHg (${rangoMin.toFixed(1)}-${rangoMax.toFixed(1)})`;

            if (PaCO2 < rangoMin) {
              compensacionEsperada += ' → Sobrecompensación (Alcalosis Respiratoria adicional)';
            } else if (PaCO2 > rangoMax) {
              compensacionEsperada += ' → Compensación inadecuada (Acidosis Respiratoria adicional)';
            } else {
              compensacionEsperada += ' → Compensación adecuada';
            }
          } else if (trastornoPrimario.includes('Alcalosis Metabólica')) {
            const aumentoEsperado = (HCO3 - normalHCO3) * 0.6;
            const valorEsperado = normalPaCO2 + aumentoEsperado;
            compensacionEsperada = `↑ PaCO₂ esperada: +${aumentoEsperado.toFixed(1)} mmHg (PaCO₂ = ${valorEsperado.toFixed(1)} mmHg)`;

            if (Math.abs(PaCO2 - valorEsperado) > 2) {
              compensacionEsperada += PaCO2 > valorEsperado ? ' → Compensación excesiva' : ' → Compensación inadecuada';
            } else {
              compensacionEsperada += ' → Compensación adecuada';
            }
          } else if (trastornoPrimario.includes('Acidosis Respiratoria')) {
            const aumentoAguda = (PaCO2 - normalPaCO2) / 10;
            const aumentoCronica = 4 * ((PaCO2 - normalPaCO2) / 10);
            const aguda = normalHCO3 + aumentoAguda;
            const cronica = normalHCO3 + aumentoCronica;
            compensacionEsperada = `Aguda: ↑ HCO₃⁻ = ${aumentoAguda.toFixed(1)} (HCO₃⁻ esperado = ${aguda.toFixed(1)} mEq/L)\n`;
            compensacionEsperada += `Crónica: ↑ HCO₃⁻ = ${aumentoCronica.toFixed(1)} (HCO₃⁻ esperado = ${cronica.toFixed(1)} mEq/L)`;
          } else if (trastornoPrimario.includes('Alcalosis Respiratoria')) {
            const disminucionAguda = 2 * ((normalPaCO2 - PaCO2) / 10);
            const disminucionCronica = 5 * ((normalPaCO2 - PaCO2) / 10);
            const aguda = normalHCO3 - disminucionAguda;
            const cronica = normalHCO3 - disminucionCronica;
            compensacionEsperada = `Aguda: ↓ HCO₃⁻ = ${disminucionAguda.toFixed(1)} (HCO₃⁻ esperado = ${aguda.toFixed(1)} mEq/L)\n`;
            compensacionEsperada += `Crónica: ↓ HCO₃⁻ = ${disminucionCronica.toFixed(1)} (HCO₃⁻ esperado = ${cronica.toFixed(1)} mEq/L)`;
          }

          interpretation.paso3 = compensacionEsperada;

          if (Number.isFinite(sodio) && Number.isFinite(cloro)) {
            const AG = sodio - (HCO3 + cloro);
            const albuminaValida = Number.isFinite(albumina) ? albumina : 4;
            const AGc = AG + 2.5 * (4 - albuminaValida);
            interpretation.anionGap = formatNumber(AG);
            interpretation.anionGapCorregido = formatNumber(AGc);

            if (AGc > 14) {
              interpretation.paso4 = `Anión Gap Corregido: ${AGc.toFixed(1)} mEq/L → ELEVADO (>14)`;
            } else if (AGc < 10) {
              interpretation.paso4 = `Anión Gap Corregido: ${AGc.toFixed(1)} mEq/L → BAJO (<10)`;
            } else {
              interpretation.paso4 = `Anión Gap Corregido: ${AGc.toFixed(1)} mEq/L → NORMAL (10-14)`;
            }

            if (trastornoPrimario.includes('Acidosis Metabólica') && AGc > 14) {
              const deltaAG = AGc - 12;
              const HCO3esperado = normalHCO3 - deltaAG;
              const HCO3corregido = HCO3esperado;

              interpretation.delta = {
                deltaAG: deltaAG.toFixed(1),
                HCO3esperado: HCO3esperado.toFixed(1),
                HCO3corregido: HCO3corregido.toFixed(1),
              };

              if (Math.abs(HCO3 - HCO3corregido) <= 2) {
                interpretation.paso5 = `Delta AG: ${deltaAG.toFixed(1)} | HCO₃⁻ corregido: ${HCO3corregido.toFixed(1)} → Acidosis metabólica con AG elevado únicamente`;
              } else if (HCO3 < HCO3corregido - 2) {
                interpretation.paso5 = `Delta AG: ${deltaAG.toFixed(1)} | HCO₃⁻ corregido: ${HCO3corregido.toFixed(1)} → Acidosis metabólica con AG + Acidosis metabólica sin AG`;
              } else if (HCO3 > HCO3corregido + 2) {
                interpretation.paso5 = `Delta AG: ${deltaAG.toFixed(1)} | HCO₃⁻ corregido: ${HCO3corregido.toFixed(1)} → Acidosis metabólica con AG + Alcalosis metabólica`;
              }
            }
          }

          if (Number.isFinite(lactato)) {
            if (lactato > 2) {
              interpretation.paso6 = `⚠️ Lactato elevado: ${lactato.toFixed(1)} mmol/L (>2) → Acidosis láctica presente`;
            } else {
              interpretation.paso6 = `✅ Lactato normal: ${lactato.toFixed(1)} mmol/L (≤2)`;
            }
          }

          setResults(interpretation);
        };

        return (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
            <div className="max-w-6xl mx-auto">
              <div className="bg-white rounded-2xl shadow-2xl overflow-hidden">
                <div className="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 text-white">
                  <div className="flex items-center gap-3">
                    <ActivityIcon />
                    <div>
                      <h1 className="text-3xl font-bold">Interpretador de Gases Arteriales</h1>
                      <p className="text-blue-100 text-sm mt-1">
                        Análisis clínico completo y sistemático
                      </p>
                    </div>
                  </div>
                </div>

                <div className="p-6 space-y-6">
                  <div className="grid md:grid-cols-2 gap-6">
                    <div className="space-y-4">
                      <h3 className="font-semibold text-lg text-gray-800 border-b pb-2">
                        Configuración Regional
                      </h3>

                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">
                          Ubicación
                        </label>
                        <select
                          value={location}
                          onChange={(e) => {
                            setLocation(e.target.value);
                            setResults(null);
                          }}
                          className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        >
                          <option value="mar">Nivel del Mar</option>
                          <option value="bogota">Bogotá (2640 msnm)</option>
                        </select>
                      </div>

                      {location === 'bogota' && (
                        <>
                          <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">
                              Edad (años)
                            </label>
                            <input
                              type="number"
                              value={age}
                              onChange={(e) => setAge(e.target.value)}
                              placeholder="Ej: 45"
                              className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                            />
                          </div>

                          <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">
                              Género
                            </label>
                            <select
                              value={gender}
                              onChange={(e) => setGender(e.target.value)}
                              className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                            >
                              <option value="">Seleccionar...</option>
                              <option value="hombre">Hombre</option>
                              <option value="mujer">Mujer</option>
                            </select>
                          </div>
                        </>
                      )}
                    </div>

                    <div className="space-y-4">
                      <h3 className="font-semibold text-lg text-gray-800 border-b pb-2">
                        Gases Arteriales
                      </h3>

                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1">pH</label>
                          <input
                            type="number"
                            step="0.01"
                            value={params.pH}
                            onChange={(e) => handleInputChange('pH', e.target.value)}
                            placeholder="7.40"
                            className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                          />
                        </div>

                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1">
                            PaCO₂ (mmHg)
                          </label>
                          <input
                            type="number"
                            step="0.1"
                            value={params.PaCO2}
                            onChange={(e) => handleInputChange('PaCO2', e.target.value)}
                            placeholder="40"
                            className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                          />
                        </div>

                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1">
                            HCO₃⁻ (mEq/L)
                          </label>
                          <input
                            type="number"
                            step="0.1"
                            value={params.HCO3}
                            onChange={(e) => handleInputChange('HCO3', e.target.value)}
                            placeholder="24"
                            className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                          />
                        </div>

                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1">
                            PaO₂ (mmHg)
                          </label>
                          <input
                            type="number"
                            step="0.1"
                            value={params.PaO2}
                            onChange={(e) => handleInputChange('PaO2', e.target.value)}
                            placeholder="90"
                            className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                          />
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="space-y-4">
                    <h3 className="font-semibold text-lg text-gray-800 border-b pb-2">
                      Electrolitos y Otros Parámetros
                    </h3>

                    <div className="grid md:grid-cols-4 gap-3">
                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Na⁺ (mEq/L)</label>
                        <input
                          type="number"
                          step="0.1"
                          value={params.sodio}
                          onChange={(e) => handleInputChange('sodio', e.target.value)}
                          placeholder="140"
                          className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                        />
                      </div>

                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">K⁺ (mEq/L)</label>
                        <input
                          type="number"
                          step="0.1"
                          value={params.potasio}
                          onChange={(e) => handleInputChange('potasio', e.target.value)}
                          placeholder="4.0"
                          className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                        />
                      </div>

                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Cl⁻ (mEq/L)</label>
                        <input
                          type="number"
                          step="0.1"
                          value={params.cloro}
                          onChange={(e) => handleInputChange('cloro', e.target.value)}
                          placeholder="100"
                          className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                        />
                      </div>

                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">
                          Glucosa (mg/dL)
                        </label>
                        <input
                          type="number"
                          step="0.1"
                          value={params.glucosa}
                          onChange={(e) => handleInputChange('glucosa', e.target.value)}
                          placeholder="100"
                          className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                        />
                      </div>

                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">
                          Albúmina (g/dL)
                        </label>
                        <input
                          type="number"
                          step="0.1"
                          value={params.albumina}
                          onChange={(e) => handleInputChange('albumina', e.target.value)}
                          className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                        />
                      </div>

                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">
                          Lactato (mmol/L)
                        </label>
                        <input
                          type="number"
                          step="0.1"
                          value={params.lactato}
                          onChange={(e) => handleInputChange('lactato', e.target.value)}
                          placeholder="1.0"
                          className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                        />
                      </div>

                      <div className="md:col-span-2">
                        <label className="block text-sm font-medium text-gray-700 mb-1">
                          Osmolaridad Calculada
                        </label>
                        <div className="w-full p-2 bg-gray-100 border border-gray-300 rounded-lg font-semibold text-blue-700">
                          {osmolaridad ? `${osmolaridad.toFixed(2)} mOsm/kg` : '\u2014'}
                        </div>
                      </div>
                    </div>
                  </div>

                  <button
                    onClick={interpretarGases}
                    className="w-full bg-gradient-to-r from-blue-600 to-indigo-700 text-white py-3 rounded-lg font-semibold text-lg hover:from-blue-700 hover:to-indigo-800 transition-all shadow-lg flex items-center justify-center gap-2"
                  >
                    <CalculatorIcon />
                    Interpretar Gases Arteriales
                  </button>

                  {results && (
                    <div className="bg-gradient-to-br from-blue-50 to-indigo-50 rounded-xl p-6 space-y-4 border-2 border-blue-200">
                      <h3 className="text-2xl font-bold text-gray-800 flex items-center gap-2">
                        <span className="text-blue-600">
                          <AlertCircleIcon />
                        </span>
                        Resultados de la Interpretación
                      </h3>

                      <div className="space-y-3">
                        {results.paso1 && (
                          <div className="bg-white p-4 rounded-lg shadow">
                            <h4 className="font-semibold text-blue-700 mb-2">1. Estado Ácido-Base</h4>
                            <p className="text-gray-800 text-lg">{results.paso1}</p>
                          </div>
                        )}

                        {results.paso2 && (
                          <div className="bg-white p-4 rounded-lg shadow">
                            <h4 className="font-semibold text-blue-700 mb-2">2. Trastorno Primario</h4>
                            <p className="text-gray-800">{results.paso2}</p>
                          </div>
                        )}

                        {results.paso3 && (
                          <div className="bg-white p-4 rounded-lg shadow">
                            <h4 className="font-semibold text-blue-700 mb-2">3. Compensación Esperada</h4>
                            <p className="text-gray-800 whitespace-pre-line">{results.paso3}</p>
                          </div>
                        )}

                        {results.paso4 && (
                          <div className="bg-white p-4 rounded-lg shadow">
                            <h4 className="font-semibold text-blue-700 mb-2">4. Anión Gap</h4>
                            <p className="text-gray-800">
                              AG: {results.anionGap ?? '\u2014'} mEq/L
                            </p>
                            <p className="text-gray-800">{results.paso4}</p>
                          </div>
                        )}

                        {results.paso5 && (
                          <div className="bg-white p-4 rounded-lg shadow">
                            <h4 className="font-semibold text-blue-700 mb-2">5. Delta Anión Gap</h4>
                            <p className="text-gray-800">{results.paso5}</p>
                          </div>
                        )}

                        {results.paso6 && (
                          <div className="bg-white p-4 rounded-lg shadow">
                            <h4 className="font-semibold text-blue-700 mb-2">6. Evaluación de Lactato</h4>
                            <p className="text-gray-800">{results.paso6}</p>
                          </div>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<ArterialGasInterpreter />);
    </script>
  </body>
</html>
