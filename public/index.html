<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de IMC</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      --verde: #3cb371;
      --naranja: #ffa500;
      --rojo: #ff6b6b;
      --azul: #4f46e5;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #e8f5ff 0%, #f8f9ff 100%);
      padding: 20px;
    }

    .contenedor {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(79, 70, 229, 0.15);
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: var(--azul);
      font-size: 2.2rem;
    }

    p.descripcion {
      text-align: center;
      color: #4b5563;
      margin-bottom: 32px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #1f2937;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      font-size: 1rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background-color: rgba(255, 255, 255, 0.8);
      box-sizing: border-box;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--azul);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
    }

    .fila {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: var(--azul);
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.25);
    }

    .resultado {
      margin-top: 30px;
      background: #f9fafb;
      border-radius: 18px;
      padding: 24px;
      border: 1px solid #e5e7eb;
    }

    .valor-imc {
      font-size: 2.5rem;
      font-weight: 700;
      text-align: center;
      margin: 0 0 12px 0;
    }

    .categoria {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .barra {
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--rojo) 0%, var(--naranja) 45%, var(--verde) 65%, var(--azul) 100%);
      position: relative;
      margin-bottom: 20px;
    }

    .indicador {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #111827;
      border: 3px solid white;
      box-shadow: 0 0 0 4px rgba(17, 24, 39, 0.08);
    }

    .recomendaciones {
      font-size: 0.95rem;
      color: #4b5563;
      line-height: 1.6;
    }

    .mensaje-error {
      background: rgba(255, 107, 107, 0.12);
      border: 1px solid rgba(255, 107, 107, 0.3);
      color: #b91c1c;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: none;
    }

    @media (max-width: 480px) {
      .contenedor {
        padding: 28px 20px;
      }

      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <main class="contenedor">
    <h1>Calculadora de IMC</h1>
    <p class="descripcion">Introduce tu peso y altura para conocer tu Índice de Masa Corporal y obtener recomendaciones personalizadas.</p>

    <div class="mensaje-error" id="mensajeError"></div>

    <form id="formularioImc" novalidate>
      <div class="fila">
        <div>
          <label for="sistemaMedida">Sistema de medida</label>
          <select id="sistemaMedida" name="sistemaMedida">
            <option value="metric">Métrico (kg, cm)</option>
            <option value="imperial">Imperial (lb, in)</option>
          </select>
        </div>
        <div>
          <label for="edad">Edad</label>
          <input type="number" id="edad" name="edad" min="1" max="120" placeholder="Ej. 30" />
        </div>
      </div>

      <div class="fila">
        <div>
          <label for="peso">Peso</label>
          <input type="number" id="peso" name="peso" min="1" step="0.1" placeholder="Ej. 70" required />
        </div>
        <div>
          <label for="altura">Altura</label>
          <input type="number" id="altura" name="altura" min="1" step="0.1" placeholder="Ej. 170" required />
        </div>
      </div>

      <button type="submit">Calcular IMC</button>
    </form>

    <section class="resultado" id="panelResultado" aria-live="polite" hidden>
      <p class="valor-imc" id="valorImc">0</p>
      <p class="categoria" id="categoriaImc"></p>
      <div class="barra">
        <span class="indicador" id="indicador" style="left: 0%"></span>
      </div>
      <div class="recomendaciones" id="recomendaciones"></div>
    </section>
  </main>

  <script>
    const formulario = document.getElementById('formularioImc');
    const mensajeError = document.getElementById('mensajeError');
    const panelResultado = document.getElementById('panelResultado');
    const valorImc = document.getElementById('valorImc');
    const categoriaImc = document.getElementById('categoriaImc');
    const recomendaciones = document.getElementById('recomendaciones');
    const indicador = document.getElementById('indicador');
    const sistemaMedida = document.getElementById('sistemaMedida');
    const alturaInput = document.getElementById('altura');
    const pesoInput = document.getElementById('peso');

    const mensajesPorCategoria = {
      bajo: {
        titulo: 'Bajo peso',
        descripcion: 'Tu IMC indica un peso por debajo de lo recomendado. Te sugerimos consultar con un profesional de la salud para valorar tu alimentación y estado general.'
      },
      normal: {
        titulo: 'Peso saludable',
        descripcion: '¡Excelente! Tu IMC se encuentra dentro del rango saludable. Mantén una dieta equilibrada y actividad física regular para conservar tu bienestar.'
      },
      sobrepeso: {
        titulo: 'Sobrepeso',
        descripcion: 'Tu IMC se sitúa en el rango de sobrepeso. Considera incorporar hábitos saludables como actividad física moderada y ajustes en la alimentación.'
      },
      obesidad: {
        titulo: 'Obesidad',
        descripcion: 'El IMC obtenido indica obesidad. Es recomendable recibir orientación médica para elaborar un plan personalizado que te ayude a mejorar tu salud.'
      }
    };

    sistemaMedida.addEventListener('change', () => {
      if (sistemaMedida.value === 'imperial') {
        pesoInput.placeholder = 'Ej. 154';
        alturaInput.placeholder = 'Ej. 67';
        pesoInput.labels[0].textContent = 'Peso (lb)';
        alturaInput.labels[0].textContent = 'Altura (in)';
      } else {
        pesoInput.placeholder = 'Ej. 70';
        alturaInput.placeholder = 'Ej. 170';
        pesoInput.labels[0].textContent = 'Peso (kg)';
        alturaInput.labels[0].textContent = 'Altura (cm)';
      }
    });

    formulario.addEventListener('submit', (event) => {
      event.preventDefault();
      mensajeError.style.display = 'none';

      const peso = parseFloat(pesoInput.value);
      const altura = parseFloat(alturaInput.value);

      if (!peso || !altura || peso <= 0 || altura <= 0) {
        mostrarError('Por favor, introduce valores válidos de peso y altura mayores que cero.');
        return;
      }

      const { imc, categoria } = calcularImc(peso, altura, sistemaMedida.value);
      actualizarResultados(imc, categoria, sistemaMedida.value);
    });

    function mostrarError(mensaje) {
      mensajeError.textContent = mensaje;
      mensajeError.style.display = 'block';
      panelResultado.hidden = true;
    }

    function calcularImc(peso, altura, sistema) {
      let alturaMetros;
      let pesoKilogramos;

      if (sistema === 'imperial') {
        pesoKilogramos = peso * 0.45359237;
        alturaMetros = altura * 0.0254;
      } else {
        pesoKilogramos = peso;
        alturaMetros = altura / 100;
      }

      const imc = pesoKilogramos / Math.pow(alturaMetros, 2);
      let categoria;

      if (imc < 18.5) categoria = 'bajo';
      else if (imc < 25) categoria = 'normal';
      else if (imc < 30) categoria = 'sobrepeso';
      else categoria = 'obesidad';

      return { imc, categoria };
    }

    function actualizarResultados(imc, categoria, sistema) {
      const imcRedondeado = imc.toFixed(1);
      valorImc.textContent = imcRedondeado;

      const infoCategoria = mensajesPorCategoria[categoria];
      categoriaImc.textContent = infoCategoria.titulo;
      categoriaImc.style.color = obtenerColorCategoria(categoria);
      recomendaciones.innerHTML = generarTextoRecomendaciones(infoCategoria.descripcion, sistema);

      const posicion = Math.max(0, Math.min(100, (imc / 40) * 100));
      indicador.style.left = `${posicion}%`;

      panelResultado.hidden = false;
    }

    function obtenerColorCategoria(categoria) {
      switch (categoria) {
        case 'bajo':
          return 'var(--naranja)';
        case 'normal':
          return 'var(--verde)';
        case 'sobrepeso':
          return '#f59e0b';
        default:
          return 'var(--rojo)';
      }
    }

    function generarTextoRecomendaciones(descripcion, sistema) {
      const alturaLabel = sistema === 'imperial' ? 'in' : 'cm';
      const pesoLabel = sistema === 'imperial' ? 'lb' : 'kg';

      return `
        <strong>¿Qué significa?</strong> ${descripcion}
        <br><br>
        <strong>Consejo rápido:</strong> combina una alimentación equilibrada con al menos 150 minutos de actividad física moderada semanal. Si tienes condiciones médicas específicas, consulta con un profesional de la salud.
        <br><br>
        <strong>Recuerda:</strong> el IMC es una guía general y no sustituye una valoración clínica completa. También influyen la composición corporal, edad y sexo.
        <br><br>
        <small>Valores introducidos: peso ${pesoInput.value} ${pesoLabel}, altura ${alturaInput.value} ${alturaLabel}.</small>
      `;
    }
  </script>
</body>
</html>
